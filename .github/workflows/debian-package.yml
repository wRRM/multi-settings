name: Debian package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: debian-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Ubuntu 26.04 package
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ansible-core \
            build-essential \
            ca-certificates \
            curl \
            debhelper \
            desktop-file-utils \
            dh-python \
            devscripts \
            libadwaita-1-dev \
            libgtk-4-dev \
            lintian \
            meson \
            ninja-build \
            pkgconf \
            python3-all \
            python3-yaml

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version="$(dpkg-parsechangelog --show-field Version)"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Fetch pinned hardening collection
        run: ./scripts/fetch-hardening-content

      - name: Build binary package
        run: dpkg-buildpackage --build=binary --unsigned-changes

      - name: Collect and inspect package
        run: |
          mkdir -p artifacts
          cp ../multi-settings_*.deb ../multi-settings_*.buildinfo ../multi-settings_*.changes artifacts/
          dpkg-deb --info artifacts/multi-settings_*.deb
          dpkg-deb --contents artifacts/multi-settings_*.deb
          cd artifacts
          sha256sum multi-settings_*.deb > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Run Lintian
        run: lintian --fail-on warning artifacts/multi-settings_*.changes

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multi-settings-deb-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: multi-settings-deb-${{ github.sha }}
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/multi-settings_*.deb \
            artifacts/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes
